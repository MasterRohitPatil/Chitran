<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sidekick OS Form Auto-Fill Test</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; background: #f4f4f5; }
    .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #18181b; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #3f3f46; }
    input[type="text"], input[type="email"], input[type="file"] {
      width: 100%; padding: 8px; border: 1px solid #d4d4d8; border-radius: 4px; box-sizing: border-box;
    }
    button { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Job Application / Registration Form</h2>
    <form id="jobForm">
      <div class="field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="candidate_name" placeholder="Enter your full name">
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com">
      </div>
      <div class="field">
        <label for="phone">Phone / Mobile Number</label>
        <input type="text" id="phone" name="phone" placeholder="10-digit mobile number">
      </div>
      <div class="field">
        <label for="college">College / University</label>
        <input type="text" id="college" name="college" placeholder="Name of your college">
      </div>
      <div class="field">
        <label for="degree">Degree & Branch</label>
        <input type="text" id="degree" name="degree" placeholder="Degree (e.g. B.E. AIML)">
      </div>
      <div class="field">
        <label for="cgpa">Current CGPA</label>
        <input type="text" id="cgpa" name="cgpa" placeholder="e.g. 8.06">
      </div>
      <div class="field">
        <label for="passingYear">Year of Passing</label>
        <input type="text" id="passingYear" name="passing_year" placeholder="Graduation Year">
      </div>
      <div class="field">
        <label for="linkedin">LinkedIn Profile URL</label>
        <input type="text" id="linkedin" name="linkedin" placeholder="LinkedIn URL">
      </div>
      <div class="field">
        <label for="github">GitHub Profile URL</label>
        <input type="text" id="github" name="github" placeholder="GitHub URL">
      </div>
      <div class="field">
        <label for="resume">Attach Resume (PDF)</label>
        <input type="file" id="resume" name="resume">
      </div>
      <div class="field" style="margin-top: 20px;">
        <button type="submit" id="submitBtn">Submit Application</button>
      </div>
    </form>
  </div>
</body>
</html>
